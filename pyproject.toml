[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rsqlite"
version = "0.1.0"
description = "SQLite database access over Reticulum"
requires-python = ">=3.9"

dependencies = [
    "rns>=1.3.9"
] 

[project.scripts]
rsqlite = "rsqlite.cli:main"
rsqlite-server = "rsqlite.server:main"
